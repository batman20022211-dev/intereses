<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Intereses de entretenimiento</h1>
    <br>
    <form action="{{ url_for('gracias') }}" method="GET">
        <label for="nombre">Cuál es tu nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>
        <label for="juegos">¿Qué juegos juegas?</label>
        <input type="text" id="juegos" name="juegos" required>
        <br><br>
        <label>¿Qué tipo de género escuchas?</label>
        <select name="interes" required>
        <option value="">SELECCIONA</option>
        <option>Kpop</option>
        <option>Electronica</option>
        <option>Rock</option>
        <option>Hip hop</option>
        <option>Reggaetón</option>
        </select>
        <br><br>
        <label for="deporte">¿Cuál es tu deporte favorito?</label>
        <input type="text" id="deporte" name="deporte" required>
        <br><br>
        <label for="series">¿Cuál serie es tu favorita ?</label>
        <input type="text" id="series" name="series" required>
        <br><br>
        <button type="submit">Enviar formulario</button>
    </form>
</body>
</html>
